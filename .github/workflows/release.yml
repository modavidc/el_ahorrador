name: Tagged release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Semantic version to publish (for example 1.0.0-beta.1)
        required: true
        type: string
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - name: Verify generated sources are current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/data/app_database.g.dart
      - run: flutter test --coverage
      - run: >-
          dart run tool/check_coverage.dart coverage/lcov.info 30
          lib/core/financial_domain.dart=90
          lib/data/daos.dart=80
          lib/data/data_backup_service.dart=90
          lib/features/capture/application/shared_capture_coordinator.dart=90
      - run: dart run tool/check_release_identifiers.dart
      - run: dart run tool/check_release_readiness.dart
      - name: Restore Android upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
      - name: Build signed Android App Bundle
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release
          --build-name=${{ steps.release.outputs.version }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_ENV=production
          --dart-define=APP_REVISION=${{ github.sha }}
          --dart-define=SENTRY_DSN=${SENTRY_DSN}
      - name: Verify bundle signature
        # Upload keys are self-signed by design; strict PKIX validation would
        # reject a correctly signed Android App Bundle.
        run: jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab
      - name: Generate SHA-256 checksum
        working-directory: build/app/outputs/bundle/release
        run: sha256sum app-release.aab > app-release.aab.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/app/outputs/bundle/release/app-release.aab
      - name: Retain signed AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: el-ahorrador-${{ steps.release.outputs.version }}-android-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
