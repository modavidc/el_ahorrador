name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    # GitHub rejects this action until Dependency Graph is enabled in the
    # repository settings. Keep the signal visible without blocking all PRs.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/core/observability.dart test/observability_test.dart tool
      # The inherited codebase still has warning/info debt; errors remain fatal.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Verify generated sources
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/data/app_database.g.dart
      - run: flutter test --coverage --reporter expanded
      - name: Enforce coverage floor
        run: dart run tool/check_coverage.dart coverage/lcov.info 25
      - run: dart run tool/check_release_readiness.dart
      - name: Create ephemeral CI signing key
        run: >-
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-upload.jks"
          -storepass ci-android-password -alias ci-upload
          -keypass ci-android-password -keyalg RSA -keysize 2048
          -validity 3650 -dname "CN=CI,O=El Ahorrador,C=PE"
      - name: Build and verify release candidate
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ci-android-password
          ANDROID_KEY_ALIAS: ci-upload
          ANDROID_KEY_PASSWORD: ci-android-password
        run: |
          flutter build appbundle --release --dart-define=APP_ENV=ci --dart-define=APP_REVISION=${{ github.sha }}
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/app-release.aab.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            coverage/lcov.info
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: warn
          retention-days: 14
